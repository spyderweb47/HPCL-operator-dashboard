[package]
name = "hpcl-operator"
version = "1.0.0"
description = "HPCL Dealership Operator: offline-first register with cloud sync"
edition = "2021"
default-run = "hpcl-operator"

[lib]
name = "hpcl_operator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dev-bridge"
path = "src/bin/dev_bridge.rs"
required-features = ["dev-bridge"]

[features]
# Serves the same backend over HTTP so the UI can be tested in a normal browser. Never shipped.
dev-bridge = ["dep:axum"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = { version = "0.8.9", optional = true }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
futures-util = "0.3.34"
gethostname = "1.1.0"
machine-uid = "0.6.0"
mongodb = "3.9.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tokio = { version = "1.54.1", features = ["sync", "time", "macros", "rt-multi-thread"] }
uuid = { version = "1.29.0", features = ["v4"] }
